# nouveau and nvidia cannot both drive a GPU: keep nouveau off it. The base
# kernel does not build nouveau (patches/freedesktop-sdk/0009); on a kernel
# that does, udev binds it to the GPUs before the sysext merges, so this only
# covers later loads and nvidia-load.service evicts an already bound nouveau.
blacklist nouveau
options nouveau modeset=0
# The open kernel modules run the GPU through its GSP firmware.
options nvidia NVreg_EnableGpuFirmware=1
