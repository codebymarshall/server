# SSH configuration for Bluefin Server.
# Hardened defaults: key-only, no password auth at all. Root ships locked;
# provision an authorized key per node through Ignition or the
# ssh.authorized_keys.root credential (docs/skills/tpm2-credential-sealing.md).
# A console password set through a credential must never be usable over the
# network.

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# Keep standard SSH file transfer available without another server process.
Subsystem sftp internal-sftp
