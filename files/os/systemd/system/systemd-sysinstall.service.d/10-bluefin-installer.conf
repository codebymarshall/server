# Booted from the USB installer (bluefin-server-installer_<ver>.raw), the
# installer UKI starts system-install.target. The medium's ESP carries the
# disk UKI and the repart.d definitions with slot A's UUIDs pinned to this
# image's usrhash; the installer UKI names the disk UKI in
# BLUEFIN_INSTALL_KERNEL (systemd.setenv=).
#
# --erase=yes: the chosen disk is always erased (no keep/erase question); the
# summary and its "yes" confirmation stay as the one safety check.
# --reboot=no + OnSuccess=bluefin-installer-done.service: sysinstall's own
# reboot waits for a key press after a bare "press any key". Instead that unit
# says on the monitor that the install is done and when to remove the stick,
# and restarts the machine after a short countdown (its SuccessAction=reboot).
# OnSuccess= only fires when the unit goes inactive: RemainAfterExit=no keeps
# it firing once upstream's unit is Type=oneshot with RemainAfterExit=yes
# (systemd v262; v261 sets neither).
# FailureAction=none (upstream: halt): a failed or cancelled install leaves the
# unit failed and the machine up, so sysinstall's error stays on the monitor
# and the journal, which lives only in RAM, is not lost to a halt.
# --mute-console=yes: mute console status/kernel messages while sysinstall
# runs its interactive summary and confirmation prompts.
# --set-credential=bluefin.prompt-root-password:1: the installed disk asks for
# a root password on its first boot (bluefin-root-password-prompt.service);
# root ships locked and nothing else would let the new owner log in.
# Requires=bluefin-installer-secure-boot.service: Secure Boot is checked
# before anything is erased (#309). Secure Boot on with the stick's keys
# passes silently; otherwise that unit explains the firmware change and asks
# on the monitor (Cancel by default), and when it fails sysinstall never
# starts. FailureAction= is not involved: a unit whose dependency failed does
# not run, so the installer stays up with the reason on the monitor.
# $BLUEFIN_INSTALL_ARGS: empty (no arguments) when booted from the default
# boot menu entry. The Homelab entries' bluefin-homelab-install.service sets
# it in the EnvironmentFile, which overrides Environment=: one more repart.d
# drop-in directory and the template (and a node's join passphrase) as
# credentials for the target.
# Requires=bluefin-installer-disk.service and $BLUEFIN_INSTALL_TARGET: that
# unit lists the disks with their size and model (sysinstall v261 shows one
# /dev/disk/by-id/ name each, nothing else) and passes the chosen one as
# sysinstall's device argument, so sysinstall does not ask for the disk; it
# still checks that the install fits and asks for "yes". Cancelled, it fails
# and sysinstall never starts. Unattended installs skip its question, and the
# variable is empty (no argument), as their drop-in names the disk.
# ExecStartPre=udevadm settle, then /run/bluefin-sysinstall/started: udev
# finishes every queued partition add (90-bluefin-installer-forget-partitions
# .rules forgets the target's old partition devices) before the marker exists;
# from then on the rule leaves the new install's partitions alone (#359).
# The marker lives in RuntimeDirectory=, which systemd creates before
# ExecStartPre= and removes when the unit stops, so it cannot be the marker
# itself.
[Unit]
RequiresMountsFor=/run/bluefin/installer
OnSuccess=bluefin-installer-done.service
FailureAction=none
Requires=bluefin-installer-secure-boot.service
After=bluefin-installer-secure-boot.service
Wants=bluefin-homelab-install.service
After=bluefin-homelab-install.service
Requires=bluefin-installer-disk.service
After=bluefin-installer-disk.service

[Service]
RemainAfterExit=no
RuntimeDirectory=bluefin-sysinstall
ExecStartPre=/usr/bin/udevadm settle
ExecStartPre=/usr/bin/touch /run/bluefin-sysinstall/started
Environment=BLUEFIN_INSTALL_ARGS= BLUEFIN_INSTALL_TARGET=
EnvironmentFile=-/run/bluefin-homelab-install/sysinstall.env
EnvironmentFile=-/run/bluefin-installer-disk/sysinstall.env
ExecStart=
ExecStart=systemd-sysinstall --variables=yes --erase=yes --reboot=no --mute-console=yes --definitions=/run/bluefin/installer/bluefin/repart.d --kernel=${BLUEFIN_INSTALL_KERNEL} --set-credential=bluefin.prompt-root-password:1 $BLUEFIN_INSTALL_ARGS $BLUEFIN_INSTALL_TARGET
