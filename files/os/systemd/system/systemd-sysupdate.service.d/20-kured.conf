[Service]
# Kured reboots Kubernetes nodes one at a time (cordon, drain, reboot) once
# /run/reboot-required exists. Flag it only when a newer version than the
# booted one is installed and has not already failed its boot tries
# (bluefin-update-pending): `systemd-sysupdate update` also succeeds when there
# was nothing to download. ExecStopPost, not ExecStartPost: the service is
# Type=simple, so ExecStartPost would run as soon as the update started.
# `bluefin-host kured-flag` runs bluefin-update-pending and touches the flag
# when it reports an update; nothing pending is not a failure.
ExecStopPost=/usr/bin/bluefin-host kured-flag
