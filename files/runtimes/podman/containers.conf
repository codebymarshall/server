[containers]
init_path = "/usr/lib/bluefin/podman/bin/catatonit"
seccomp_profile = "/usr/lib/bluefin/podman/share/containers/seccomp.json"

[engine]
runtime = "crun"
conmon_path = ["/usr/lib/bluefin/podman/libexec/podman/conmon"]
helper_binaries_dir = ["/usr/lib/bluefin/podman/libexec/podman", "/usr/lib/bluefin/podman/bin"]
cgroup_manager = "systemd"
events_logger = "journald"

[engine.runtimes]
crun = ["/usr/lib/bluefin/podman/bin/crun"]

[network]
network_backend = "netavark"
default_rootless_network_cmd = "pasta"
firewall_driver = "nftables"
