# C copies only absent targets, preserving operator configuration.
C /etc/containers/policy.json 0644 root root - /usr/lib/bluefin/podman/etc/containers/policy.json
C /etc/containers/registries.conf 0644 root root - /usr/lib/bluefin/podman/etc/containers/registries.conf
C /etc/containers/registries.d - root root - /usr/lib/bluefin/podman/etc/containers/registries.d
C /etc/containers/registries.conf.d - root root - /usr/lib/bluefin/podman/etc/containers/registries.conf.d
