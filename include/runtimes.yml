# Optional host runtimes. FSDK components inherit the immutable junction pin;
# release artifacts are integrity-pinned per architecture in docker-bin.bst.
# Upstream artifacts are republished inside Bluefin's signed release inventory,
# never fetched unsigned by an installed node.
variables:
  # renovate: datasource=github-releases depName=moby/moby extractVersion=^docker-v(?<version>.*)$
  docker-version: "29.9.0"
  # renovate: datasource=github-releases depName=docker/compose extractVersion=^v(?<version>.*)$
  docker-compose-version: "5.6.0"
  # renovate: datasource=github-releases depName=docker/buildx extractVersion=^v(?<version>.*)$
  docker-buildx-version: "0.38.0"
  # renovate: datasource=github-releases depName=rootless-containers/slirp4netns extractVersion=^v(?<version>.*)$
  slirp4netns-version: "1.3.6"
